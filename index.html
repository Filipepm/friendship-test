<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A party game for up to 10 friends: answer about yourself, guess each other, see who knows who best.">
<title>Friendship Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Figtree:wght@400;500;600;700;800&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: one centered game column (max 560px), a slim status bar, big tappable answer tiles like a game-show podium. */
:root{
  --bg:#EAF1EE; --card:#FFFFFF; --ink:#11231F; --muted:#557069; --line:#CBDCD6;
  --accent:#F2A900; --accent-ink:#1E1600; --teal:#0F766E; --teal-ink:#FFFFFF;
  --o1:#E8590C; --o2:#1C7ED6; --o3:#2B9348; --o4:#9C36B5; --o-ink:#FFFFFF;
  --good:#2B9348; --good-bg:#DDF3E3; --warn:#B7791F; --bad:#C92A2A; --bad-bg:#FBE3E3;
  --easy:#2B9348; --medium:#D9480F; --hard:#AE3EC9;
  --p0:#E0533A;--p1:#2F7FD0;--p2:#1E8F66;--p3:#7C4DDB;--p4:#D23F80;--p5:#0E8291;--p6:#B7791F;--p7:#4F51C9;--p8:#4E8A1E;--p9:#D9631B;
  --pc:var(--teal); --tint:13%; --soft:7%;
  --display:"Dela Gothic One","Arial Black",Impact,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1716; --card:#142422; --ink:#E6F1EE; --muted:#8FA9A2; --line:#24403B;
  --accent:#F5B82E; --accent-ink:#1E1600; --teal:#2DB3A6; --teal-ink:#06201D;
  --good-bg:#16352A; --bad-bg:#3A1A1C; --good:#5BD07C; --bad:#FF7B7B; --tint:20%; --soft:14%;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1716; --card:#142422; --ink:#E6F1EE; --muted:#8FA9A2; --line:#24403B;
  --accent:#F5B82E; --accent-ink:#1E1600; --teal:#2DB3A6; --teal-ink:#06201D;
  --good-bg:#16352A; --bad-bg:#3A1A1C; --good:#5BD07C; --bad:#FF7B7B; --tint:20%; --soft:14%;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;padding:0 16px;padding-block:16px 48px}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,.display{font-family:var(--display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(2.1rem,9vw,3rem);line-height:1}
h2{font-size:1.45rem;line-height:1.15}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.label{font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bar .brand{font-family:var(--display);font-size:1rem;margin-right:auto}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:700;background:var(--card)}
.chip.code{font-family:var(--mono);letter-spacing:.12em}
.mode-easy{color:var(--easy)}.mode-medium{color:var(--medium)}.mode-hard{color:var(--hard)}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > *{min-width:0}
input[type=text]{font:inherit;font-size:1.05rem;width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=text]:focus{outline:3px solid var(--accent);outline-offset:1px}
input.codein{font-family:var(--mono);text-transform:uppercase;letter-spacing:.3em;text-align:center;font-size:1.3rem}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;font-weight:700;background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-main{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-size:1.05rem}
.btn-alt{background:var(--teal);color:var(--teal-ink);border-color:transparent}
.btn-link{background:none;border:0;padding:6px 0;color:var(--muted);text-decoration:underline;font-weight:600}
.grow{flex:1}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:460px){.modes{grid-template-columns:1fr}}
.mode{text-align:left;display:flex;flex-direction:column;gap:4px;padding:12px;background:var(--bg)}
.mode b{font-family:var(--display);font-weight:400;font-size:1.05rem}
.mode span{font-weight:500;font-size:.82rem;color:var(--muted)}
.mode[aria-pressed=true]{border-color:currentColor;border-width:2.5px;background:var(--card)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:7px 12px;font-size:.9rem}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bigcode{font-family:var(--mono);font-size:clamp(2.4rem,13vw,3.6rem);letter-spacing:.22em;line-height:1}
.seats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.seat{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);min-height:48px;min-width:0}
.seat.empty{border-style:dashed;color:var(--muted);font-size:.85rem}
.seat .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dot{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--o-ink);font-weight:800;font-size:.8rem}
.tag{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-left:auto;flex:none}
.prog{display:flex;gap:5px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--teal)}
.prog i.cur{background:var(--accent)}
.qcard{display:flex;flex-direction:column;gap:6px}
.qtext{font-family:var(--display);font-size:clamp(1.35rem,5.5vw,1.8rem);line-height:1.15;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border-radius:12px;border:0;color:var(--o-ink);font-size:1.05rem;min-height:58px}
.opt .lt{font-family:var(--display);font-size:1.1rem;width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.opt.o0{background:var(--o1)}.opt.o1{background:var(--o2)}.opt.o2{background:var(--o3)}.opt.o3{background:var(--o4)}
.opt.sel{outline:4px solid var(--ink);outline-offset:2px}
.rv-opt{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card)}
.rv-opt .top{display:flex;align-items:center;gap:10px;font-weight:700}
.rv-opt .lt{font-family:var(--display);width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--o-ink);flex:none}
.rv-opt.right{border-color:var(--good);background:var(--good-bg)}
.rv-opt.dim{opacity:.5}
.badge{margin-left:auto;font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--good);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 3px;border-radius:999px;background:var(--bg);font-size:.82rem;font-weight:700;border:1.5px solid var(--line)}
.pchip .dot{width:20px;height:20px;font-size:.65rem}
.pchip.hit{border-color:var(--good)}
.target{display:flex;align-items:center;gap:12px}
.target .dot{width:46px;height:46px;font-size:1.2rem}
.board{display:flex;flex-direction:column;gap:6px}
.brow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--bg);font-variant-numeric:tabular-nums}
.brow .rk{width:22px;font-weight:800;color:var(--muted);text-align:right;flex:none}
.brow .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .pts{margin-left:auto;font-weight:800;font-size:1.1rem;flex:none}
.brow .gain{color:var(--good);font-weight:700;font-size:.85rem;flex:none}
.brow.me{outline:2px solid var(--accent)}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:8px;text-align:center}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pod .nm{font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .blk{width:100%;border-radius:10px 10px 0 0;display:grid;place-items:center;font-family:var(--display);font-size:1.6rem;color:var(--accent-ink);background:var(--accent)}
.pod.p2 .blk,.pod.p3 .blk{background:var(--line);color:var(--ink)}
.list{display:flex;flex-direction:column;gap:6px}
.lobbyrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg)}
.lobbyrow .info{min-width:0;flex:1}
.lobbyrow .info b{font-family:var(--mono);letter-spacing:.12em}
.sumrow{display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:10px 12px;font-weight:500}
.sumrow .lt{font-family:var(--display);width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--o-ink);flex:none}
.sumrow .q{min-width:0;flex:1}
.sumrow .q small{display:block;color:var(--muted)}
.logo{display:flex;flex-direction:column;align-items:center;gap:2px;padding-block:18px 8px;user-select:none}
.logo-top{display:flex;justify-content:center;font-family:var(--display);font-size:clamp(2.1rem,10.5vw,3.6rem);line-height:1}
.logo-top span{display:inline-block;color:var(--c);transform:rotate(var(--r));-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.logo-tag{font-family:var(--display);font-size:clamp(1.2rem,5.5vw,1.8rem);letter-spacing:.35em;padding:6px 10px 6px calc(10px + .35em);margin-top:10px;background:var(--accent);color:var(--accent-ink);border:2.5px solid var(--ink);border-radius:10px;transform:rotate(-3deg);box-shadow:0 4px 0 var(--ink)}
@media (prefers-reduced-motion:no-preference){.logo-top span{animation:drop .5s cubic-bezier(.2,1.5,.4,1) both;animation-delay:var(--d)}.logo-tag{animation:drop .5s .5s cubic-bezier(.2,1.5,.4,1) both}}
@keyframes drop{from{opacity:0;transform:translateY(-24px) rotate(0)}}
.buildtag{text-align:center;font-size:.75rem;color:var(--muted);font-family:var(--mono);margin-top:-4px}
.testnote{padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--accent) 18%,var(--card));border:1.5px solid color-mix(in srgb,var(--accent) 45%,transparent);font-size:.92rem}
.notice{padding:12px 14px;border-radius:10px;background:var(--bad-bg);color:var(--ink);font-size:.92rem}
.waitlist{display:flex;flex-wrap:wrap;gap:6px}
.finishing{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-block:18px}
.finishing .who{display:flex;justify-content:center}
.finishing .who .dot{width:54px;height:54px;font-size:1.3rem;border:3px solid var(--card);margin-left:-12px}
.finishing .who .dot:first-child{margin-left:0}
.typing{display:flex;gap:6px}
.typing i{width:9px;height:9px;border-radius:50%;background:var(--accent)}
@media (prefers-reduced-motion:no-preference){.typing i{animation:bob 1.1s infinite ease-in-out}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}}
@keyframes bob{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-6px);opacity:1}}
.pstat{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--bg);font-variant-numeric:tabular-nums}
.pstat .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pstat .st{margin-left:auto;font-weight:700;font-size:.85rem;color:var(--muted);flex:none}
.pstat .st.ok{color:var(--good)}
.fxwrap{position:relative;flex:none}
.fxbtn{font-family:var(--display);font-weight:400;padding:6px 12px;border-radius:999px;background:var(--accent);color:var(--accent-ink);border:0;font-size:1rem;line-height:1.2}
.fxbtn.scare{background:var(--ink);color:var(--bg)}
.fxmenu{position:absolute;top:calc(100% + 6px);left:0;z-index:20;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px;min-width:210px;max-width:calc(100vw - 32px);display:flex;flex-direction:column;gap:4px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.fxmenu .label{padding:4px 6px 6px}
.fxmenu button{display:flex;align-items:center;gap:8px;text-align:left;padding:8px;border:0;background:none;font-weight:700;border-radius:8px}
.fxmenu button:hover{background:var(--bg)}
.fxmenu .dot{width:24px;height:24px;font-size:.7rem}
#fx{position:fixed;inset:0;z-index:100;display:grid;place-items:center;pointer-events:none}
#fx .six{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
#fx .six b{font-family:var(--display);font-weight:400;font-size:min(62vw,62vh);line-height:.85;color:var(--accent);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 12px 0 var(--ink)}
#fx .six b{font-size:min(52vw,48vh)}
#fx .from{display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);padding:10px 22px 10px 10px;border-radius:999px;max-width:calc(100vw - 32px);text-align:left;box-shadow:0 8px 0 var(--accent)}
#fx .from .dot{width:clamp(48px,12vw,72px);height:clamp(48px,12vw,72px);font-size:clamp(1.4rem,6vw,2.2rem);border:3px solid var(--bg)}
#fx .from div{min-width:0}
#fx .from em{display:block;font-style:normal;font-family:var(--display);font-size:clamp(1.6rem,8vw,3.2rem);line-height:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fx .from small{display:block;font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:clamp(.8rem,3vw,1rem);color:var(--accent)}
.fxbtn .cd{font-family:var(--mono);font-size:.75rem;font-variant-numeric:tabular-nums}
.fxbtn:disabled{opacity:.6}
#fx.scare{background:#000}
#fx .blockcard{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--card);color:var(--ink);border:2.5px solid var(--ink);border-radius:22px;padding:22px 26px;box-shadow:0 8px 0 var(--ink);max-width:calc(100vw - 48px);font-size:clamp(1.15rem,5vw,1.5rem);font-weight:700}
#fx .blockcard .dot{width:58px;height:58px;font-size:1.5rem}
#fx .blockcard b{font-family:var(--display);font-weight:400}
#fx .blockcard small{font-size:.95rem;color:var(--muted);font-weight:600}
@media (prefers-reduced-motion:no-preference){#fx .blockcard{animation:qin .3s cubic-bezier(.2,1.4,.4,1) both}}
.fxrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;position:relative;flex:1;min-width:0}
.fxrow .fxwrap{position:static}
.fxrow .fxmenu{left:0}
.fxbtn{padding:6px 11px;font-size:.95rem}
.fxbtn.cr7{background:#D3122A;color:#fff}
.fxbtn.ride{background:var(--teal);color:var(--teal-ink)}
#fx .fxfrom{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:800;font-size:.85rem;padding:5px 12px;border-radius:999px;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
#fx .fxfrom::after{content:" sent this"}
#fx.cr7,#fx.ride{display:block}
#fx.cr7{background:rgba(10,20,18,.32)}
@media (prefers-reduced-motion:no-preference){#fx.cr7{animation:dim 2.2s ease both}}
@keyframes dim{0%{background:rgba(10,20,18,0)}10%,85%{background:rgba(10,20,18,.32)}100%{background:rgba(10,20,18,0)}}
.cr7-mover{position:absolute;left:50%;bottom:calc(6vh + env(safe-area-inset-bottom,0px));width:min(34vh,230px);transform:translateX(-50%)}
.cr7-spin{position:relative;aspect-ratio:2/3}
.cr7-spin svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pose-run{opacity:0}
.cr7-ring{position:absolute;left:50%;bottom:-2%;width:120%;aspect-ratio:3/1;border:4px solid #F2A900;border-radius:50%;transform:translateX(-50%) scale(1);opacity:0}
.siu-text{position:absolute;left:0;right:0;top:12vh;text-align:center;font-family:var(--display);font-size:min(24vw,20vh);line-height:1;color:#F2A900;-webkit-text-stroke:5px #11231F;paint-order:stroke fill;text-shadow:0 8px 0 #11231F;letter-spacing:.02em}
.ride-mover{position:absolute;left:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(100vw)}
.ride-gallop{position:relative}
.ride-gallop img{display:block;height:clamp(100px,18vh,150px);width:auto;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
.ride-gallop .rf1{position:absolute;left:0;top:0;opacity:0}
.dust{position:absolute;left:-6px;bottom:4px;width:22px;height:22px;border-radius:50%;background:color-mix(in srgb,var(--muted) 45%,transparent);opacity:0}
@media (prefers-reduced-motion:no-preference){
  .cr7-mover{animation:cr7move 2.2s cubic-bezier(.3,.6,.4,1) both}
  .cr7-spin{animation:cr7spin 2.2s linear both}
  .pose-run{animation:poseRun 2.2s steps(1,end) both}
  .pose-siu{animation:poseSiu 2.2s steps(1,end) both}
  .pose-run .leg-a{transform-origin:100px 178px;animation:legA .28s ease-in-out infinite alternate}
  .pose-run .leg-b{transform-origin:100px 178px;animation:legA .28s ease-in-out infinite alternate-reverse}
  .cr7-ring{animation:ring 2.2s ease-out both}
  .siu-text{animation:siu 2.2s cubic-bezier(.2,1.6,.4,1) both}
  .ride-mover{animation:rideX 5s linear both}
  .ride-gallop{animation:crawlbob .44s ease-in-out infinite}
  .ride-gallop .rf0{animation:crawlA .44s steps(1,end) infinite}
  .ride-gallop .rf1{animation:crawlB .44s steps(1,end) infinite}
  .dust{animation:dust .52s ease-out infinite}.dust.d2{animation-delay:.26s;bottom:16px}
}
@keyframes cr7move{0%{transform:translateX(calc(-50% - 75vw))}33%{transform:translateX(-50%)}41%{transform:translateX(-50%) translateY(-38%)}49%,100%{transform:translateX(-50%) translateY(0)}}
@keyframes cr7spin{0%,33%{transform:scaleX(1)}37%{transform:scaleX(-1)}41%{transform:scaleX(1)}45%{transform:scaleX(-1)}49%{transform:scaleX(1) scaleY(.86)}55%,100%{transform:none}}
@keyframes poseRun{0%{opacity:1}49%{opacity:0}100%{opacity:0}}
@keyframes poseSiu{0%{opacity:0}49%{opacity:1}100%{opacity:1}}
@keyframes legA{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
@keyframes ring{0%,48%{opacity:0;transform:translateX(-50%) scale(.3)}52%{opacity:1}75%,100%{opacity:0;transform:translateX(-50%) scale(1.6)}}
@keyframes siu{0%,48%{opacity:0;transform:scale(.2) rotate(-8deg)}58%{opacity:1;transform:scale(1.12) rotate(3deg)}64%{transform:scale(1) rotate(0)}90%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}
@keyframes rideX{from{transform:translateX(-110%)}to{transform:translateX(100vw)}}
@keyframes crawlbob{0%,100%{transform:translateY(0)}25%{transform:translateY(-4px)}50%{transform:translateY(0)}75%{transform:translateY(-4px)}}
@keyframes crawlA{0%{opacity:1}50%{opacity:0}}
@keyframes crawlB{0%{opacity:0}50%{opacity:1}}
@keyframes dust{0%{opacity:.8;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(-30px,-8px) scale(1.4)}}
#fx.scare svg{width:min(100vw,100vh);height:min(100vw,100vh)}
@media (prefers-reduced-motion:no-preference){#fx .six{animation:pop 1.9s cubic-bezier(.2,1.6,.4,1) both}#fx.scare svg{animation:lunge .5s ease-out both}}

  const parse=()=>{
    for(;;){const b=L.buf;if(b.length<2)return;let len=0,mul=1,i=1,byte;

  L.pub=(t,obj)=>{if(!L.up)return false;send(pkt(0x30,[...str(t),...te.encode(JSON.stringify(obj))]));return true};
  L.close=()=>{L.closed=true;clearInterval(L.ping);try{send(new Uint8Array([0xE0,0]));L.ws&&L.ws.close()}catch(e){}};

}

    if(N.closed||!fresh(m))return;
    if(N.isHost&&topic===N.base+'up'){
      if(m.k==='bye'){if(N.hp[m.f]){delete N.hp[m.f];delete N.heard[m.f];sched()}return}
      if(m.k==='p'&&m.p&&typeof m.p==='object'&&!Array.isArray(m.p)){
        if(!N.hp[m.f]&&Object.keys(N.hp).length>=16)return;
        let s;try{s=JSON.stringify(m.p)}catch(e){return}if(s.length>6000)return;
        N.heard[m.f]=Date.now();const prev=N.hp[m.f]?JSON.stringify(N.hp[m.f]):null;N.hp[m.f]=JSON.parse(s);if(prev!==s)sched()}
    }else if(topic===N.base+'down'){
      if(m.k==='peers'&&Array.isArray(m.l)){N.hostSeen=Date.now();N.lastHost=m.f;if(!N.isHost){
        /* keep my own presence current locally even before the host echoes it */
        const l=m.l.filter(x=>x&&x.peer!==N.me);l.push({peer:N.me,presence:N.pres});setList(l)}}
    }
  };
  const connect=()=>new Promise((res,rej)=>{let done=false;
    for(const u of BROKERS)N.links.push(mqttLink(u,onMsg,ok=>{if(ok&&!done){done=true;res()}if(N.onLink)N.onLink()}));
    for(const l of N.links){l.sub(N.base+'down');if(N.isHost)l.sub(N.base+'up')}
    N.timers.push(setTimeout(()=>{if(!done){done=true;rej('net')}},10000))});
  const every=(fn,ms)=>N.timers.push(setInterval(fn,ms));
  N.peers=()=>N.list;
  N.onPeers=f=>{N.subs.push(f);return()=>{N.subs=N.subs.filter(x=>x!==f)}};
  N.presence=patch=>{for(const k in patch){if(patch[k]===null)delete N.pres[k];else N.pres[k]=patch[k]}
    if(N.isHost){N.hp[N.me]=JSON.parse(JSON.stringify(N.pres));sched()}
    else{pub('up',{k:'p',p:N.pres});setList(N.list.filter(x=>x.peer!==N.me).concat([{peer:N.me,presence:N.pres}]))}
    return Promise.resolve()};
  N.leave=()=>{if(N.closed)return Promise.resolve();if(!N.isHost)pub('up',{k:'bye'});else{N.hp={};pub('down',{k:'peers',l:[]})}
    N.closed=true;for(const t of N.timers){clearTimeout(t);clearInterval(t)}clearTimeout(N.tmr);setTimeout(()=>{for(const l of N.links)l.close()},300);return Promise.resolve()};
  N.host=async id=>{N.base=PFX+id+'/';N.isHost=true;await connect();
    /* listen briefly: if someone is already hosting this code, pick another */
    await new Promise(r=>setTimeout(r,1500));if(N.hostSeen)throw 'taken';
    N.hp[N.me]=JSON.parse(JSON.stringify(N.pres));bcast();
    every(()=>{if(N.closed)return;const now=Date.now();let ch=false;for(const k in N.heard)if(now-N.heard[k]>12000){delete N.heard[k];delete N.hp[k];ch=true}if(ch)bcast();else pub('down',{k:'peers',l:snapshot()})},2500)};
  N.join=async id=>{N.base=PFX+id+'/';await connect();
    const start=Date.now();pub('up',{k:'p',p:N.pres});
    for(let i=0;!N.hostSeen;i++){if(Date.now()-start>7000)throw 'nolobby';await new Promise(r=>setTimeout(r,250));if(i%4===3)pub('up',{k:'p',p:N.pres})}
    every(()=>{if(N.closed)return;pub('up',{k:'p',p:N.pres});if(Date.now()-N.hostSeen>9000&&N.list.some(x=>x.peer!==N.me))setList(N.list.filter(x=>x.peer===N.me))},3000)};
  N.relays=()=>up();
  return N;
}

/* Inside Claude, outside connections are blocked, so the game uses Claude's own live room instead */
function makeRoomNet(){
  const N={g:null};const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const hosted=()=>N.g.peers().some(p=>!p.sameTab&&p.presence&&p.presence.h);
  const enter=async id=>{try{N.g=await room.join('ft-'+id)}catch(e){throw 'net'}};
  N.peers=()=>N.g?N.g.peers():[];
  N.onPeers=(f,err)=>N.g.onPeers(f,err);
  N.presence=p=>N.g?N.g.presence(p):Promise.resolve();
  N.leave=()=>N.g?N.g.leave().catch(()=>{}):Promise.resolve();
  N.relays=()=>1;
  N.host=async id=>{await enter(id);await wait(1200);if(hosted()){await N.leave();throw 'taken'}};
  N.join=async id=>{await enter(id);for(let t=0;t<28;t++){if(hosted())return;await wait(250)}await N.leave();throw 'nolobby'};
  return N;
}
async function joinGame(c,asHost){
  c=c.toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length!==4){toast('Lobby codes are 4 letters.');return false}
  if(game){try{game.leave()}catch(e){}game=null}
  const net=room?makeRoomNet():makeNet();
  try{await (asHost?net.host(c.toLowerCase()):net.join(c.toLowerCase()))}
  catch(e){net.leave();if(e==='taken')return 'taken';toast(e==='nolobby'?`No lobby found with code ${c}. Check the code with your host.`:"Couldn't reach the game servers. Check your internet and try again.");return false}
  game=net;
  code=c;ls.set('wkw.last',c);
  game.onPeers(onChange,()=>{toast('Lost connection to the lobby.');});
  pushMe({pid:me.pid,n:me.name,j:Date.now()});
  render();return true;
}
async function createLobby(){
  for(let i=0;i<4;i++){
    const c=Array.from({length:4},()=> 'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random()*24)]).join('');
    hs={code:c,ph:'lobby',m:pickMode,R:3,n:5,r:0,q:[],u:[],p:[],tot:{},rp:{},tg:[],ans:{},ri:0,rq:0,rv:false,t:0};
    toast('Creating your lobby…');
    const ok=await joinGame(c,true);
    if(ok===true){pushHost();return}
    hs=null;if(ok!=='taken')return;
  }
  toast("Couldn't create a lobby. Try again.");
}

  return `<div class="bar">${fxButtons(H)}<button class="menubtn" data-act="menu" aria-haspopup="dialog" aria-expanded="${menuOpen}"><span class="burger" aria-hidden="true"><i></i><i></i><i></i></span><span class="mtxt">Menu</span></button></div>`
}
function menuSheet(){
  if(!menuOpen||!game)return '';const host=amHost();const H=curH();const inLobby=H&&H.ph==='lobby';
  return `<div class="sheet-bg" data-act="menuclose"><div class="sheet" role="dialog" aria-label="Menu" data-stop="1">
    <div class="row"><h2 class="grow">Menu</h2><button class="btn-link" data-act="menuclose">Close</button></div>
    ${host&&!inLobby?`<button class="mi go ${menuArm==='restart'?'armed':''}" data-act="restart">${menuArm==='restart'?'Tap again to restart':'Restart game'}</button>`:''}
    <button class="mi warn ${menuArm==='leave'?'armed':''}" data-act="menuleave">${menuArm==='leave'?'Tap again to leave':'Leave game'}</button>
  </div></div>`
}
function qdots(n,doneFn,cur){let s='<div class="qdots">';for(let i=0;i<n;i++)s+=`<i class="${i===cur?'cur':doneFn(i)?'on':''}"></i>`;return s+'</div>'}
function qhead(H,pid,eyebrow,name,count){return `<div class="qhead">${dot(H,pid)}<div class="who">${eyebrow?`<div class="eyebrow">${eyebrow}</div>`:''}<div class="nm${eyebrow?'':' solo'}">${esc(name)}</div></div><span class="count">${count}</span></div>`}
function optList(Q,cur,act){return `<div class="opts">${Q.o.map((o,k)=>`<button class="opt ${cur===k?'sel':''}" data-act="${act}" data-v="${k}"><span class="lt">${LET[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>`}
function vHome(){
  const lobbies=[];
  const last=ls.get('wkw.last');const off=roomState!=='ok';
  return `<header class="logo" aria-label="Friendship Test"><div class="logo-top" aria-hidden="true">${[...'FRIENDSHIP'].map((ch,i)=>`<span style="--c:var(--p${[0,1,2,3,4,5,9,7,8,1][i]});--d:${i*45}ms;--r:${[-4,3,-2,4,-3,2,-4,3,-2,4][i]}deg">${ch}</span>`).join('')}</div><div class="logo-tag" aria-hidden="true">TEST</div></header>
  ${roomState==='none'?`<div class="notice">Couldn't load the multiplayer connection. Check your internet and refresh the page.</div>`:''}
  ${roomState==='connecting'?`<p class="muted small">Connecting…</p>`:''}
  <section class="panel"><label class="label" for="nm">Your name</label><input type="text" id="nm" maxlength="18" placeholder="e.g. Filipe" value="${esc(me.name)}" autocomplete="nickname"></section>
  <section class="panel"><div class="label">Create a lobby</div>
    <div class="modes">${Object.keys(MODES).map(k=>`<button class="mode mode-${k}" data-act="pickmode" data-v="${k}" aria-pressed="${pickMode===k}"><b>${MODES[k].name}</b><span>${MODES[k].desc}</span><span>${QS[k].length} questions</span></button>`).join('')}</div>
    <button class="btn-main" data-act="create" ${off?'disabled':''}>Create ${MODES[pickMode].name} lobby</button></section>
  <section class="panel"><div class="label">Join a lobby</div>
    <div class="row"><input type="text" id="jc" class="codein grow" maxlength="4" placeholder="CODE" autocomplete="off"><button class="btn-alt" data-act="join" ${off?'disabled':''}>Join</button></div>
    ${last&&!off?`<button class="btn-link" data-act="rejoin" data-v="${esc(last)}">Rejoin ${esc(last)}</button>`:''}
    ${lobbies.length?`<div class="label">Open now</div><div class="list">${lobbies.map(o=>`<div class="lobbyrow"><div class="info"><b>${esc(o.code)}</b> <span class="mode-${o.m} small" style="font-weight:700">${MODES[o.m].name}</span><div class="small muted">Hosted by ${esc(clean(o.host))} · ${Number(o.c)||0}/${MAXP}</div></div><button class="btn-alt" data-act="rejoin" data-v="${esc(o.code)}">Join</button></div>`).join('')}</div>`:''}
  </section>
  <p class="buildtag">Version ${BUILD}</p>`
}
function vLobby(H){
  const ros=rosterLive(),host=amHost();const pl=players();const extra=Object.keys(pl).length-ros.length;
  const seats=[];for(let i=0;i<MAXP;i++){const r=ros[i];seats.push(r?`<div class="seat">${dot(H,r[0])}<span class="nm">${esc(r[1])}</span>${r[0].startsWith('bot')?'<span class="tag">Bot</span>':hostInfo()&&hostInfo().peer.presence.pid===r[0]?'<span class="tag">Host</span>':r[0]===me.pid?'<span class="tag">You</span>':''}</div>`:`<div class="seat empty">Open seat</div>`)}
  const inRos=ros.some(r=>r[0]===me.pid);
  return `${header(H)}
  <section class="panel" style="align-items:center;text-align:center"><div class="label">Lobby code</div><div class="bigcode">${esc(code)}</div><button data-act="copy">Copy code</button></section>
  <section class="panel"><div class="row"><div class="label grow">Players ${ros.length}/${MAXP}</div></div><div class="seats">${seats.join('')}</div>${extra>0?`<p class="small muted">${extra} more waiting. The lobby is full.</p>`:''}${!inRos?`<div class="notice">The lobby is full. You can watch and join if a seat opens.</div>`:''}</section>
  <section class="panel"><div class="label">Mode</div>
   ${host?`<div class="modes">${Object.keys(MODES).map(k=>`<button class="mode mode-${k}" data-act="setmode" data-v="${k}" aria-pressed="${H.m===k}"><b>${MODES[k].name}</b><span>${MODES[k].desc}</span></button>`).join('')}</div>
   <div class="row"><span class="label grow">Rounds</span><div class="seg">${[1,2,3,4,5].map(v=>`<button data-act="setR" data-v="${v}" aria-pressed="${H.R===v}">${v}</button>`).join('')}</div></div>
   <div class="row"><span class="label grow">Questions per round</span><div class="seg">${[3,5,7].map(v=>`<button data-act="setN" data-v="${v}" aria-pressed="${H.n===v}">${v}</button>`).join('')}</div></div>
   <div class="row"><span class="label grow">Test bots</span><button data-act="addbot" ${ros.length>=MAXP?'disabled':''}>Add bot</button><button data-act="clearbots" ${(H.bots||[]).length?'':'disabled'}>Remove bots</button></div>
   <button class="btn-main" data-act="start" ${ros.length<2?'disabled':''}>${ros.length<2?'Need at least 2 players':'Start game'}</button>`
   :`<p><b class="mode-${H.m}">${MODES[H.m].name}</b> · ${H.R} round${H.R>1?'s':''} · ${H.n} questions each</p><p class="muted small">${MODES[H.m].desc}</p><p class="muted">Waiting for the host to start…</p>`}
  </section>
  <button class="btn-link" data-act="leave">Leave lobby</button>`
}
function progBar(n,doneFn,cur){let s='<div class="prog">';for(let i=0;i<n;i++)s+=`<i class="${i===cur?'cur':doneFn(i)?'on':''}"></i>`;return s+'</div>'}
function waitList(H,fn){const pl=players();return `<div class="waitlist">${H.p.map(([pid,n])=>{const x=pl[pid];const done=x&&fn(x.pr);return `<span class="pchip ${done?'hit':''}">${dot(H,pid)}${esc(n)} ${!x?'· away':done?'✓':'…'}</span>`}).join('')}</div>`}
function cnt(s){return typeof s==='string'?(s.match(/[0-3]/g)||[]).length:0}
function progressOf(H,kind,pr){
  if(kind==='a'){const tot=H.q.length;const d=pr&&pr.s&&pr.s.r===H.id?cnt(pr.s.a):0;return [d,tot]}
  const ts=targetsFor(H,pr?pr.pid:'');const tot=ts.length*H.q.length;let d=0;if(pr&&pr.g&&pr.g.r===H.id){const t=pr.g.t||{};for(const x of ts)d+=cnt(t[x])}return [d,tot]}
function joinNames(ns){if(ns.length===1)return ns[0];if(ns.length===2)return ns[0]+' and '+ns[1];if(ns.length===3)return ns[0]+', '+ns[1]+' and '+ns[2];return ns[0]+', '+ns[1]+' and '+(ns.length-2)+' others'}
function waitScreen(H,kind,title,skipLabel){
  const pl=players();const done=kind==='a'?pr=>doneAnswer(pr,H):pr=>doneGuess(pr,H);
  const pending=H.p.filter(([pid])=>pl[pid]&&!done(pl[pid].pr));
  const names=pending.map(([,n])=>esc(n));
  const verb=kind==='a'?'answering':'guessing';
  const headline=pending.length?`${joinNames(names)} ${pending.length===1?'is':'are'} finishing…`:'Everyone is done!';
  return `<section class="panel finishing">
    ${pending.length?`<div class="who">${pending.slice(0,5).map(([pid])=>dot(H,pid)).join('')}</div><div class="typing" aria-hidden="true"><i></i><i></i><i></i></div>`:''}
    <h2>${headline}</h2>
    <p class="muted">${title}${pending.length?` Still ${verb}: ${pending.length} of ${H.p.filter(([pid])=>pl[pid]).length}.`:''}</p>
    ${hostSkip(skipLabel)}
  </section>
  <section class="panel"><div class="label">Progress</div><div class="board">${H.p.map(([pid,n])=>{const x=pl[pid];const [d,t]=progressOf(H,kind,x&&x.pr);const ok=x&&done(x.pr);return `<div class="pstat">${dot(H,pid)}<span class="nm">${esc(n)}${pid===me.pid?' (you)':''}</span><span class="st ${ok?'ok':''}">${!x?'Left':ok?'Done ✓':d+' of '+t}</span></div>`}).join('')}</div></section>`
}
function hostSkip(label){return amHost()?`<button class="btn-link" data-act="skip">${label}</button>`:''}
function vAnswer(H){
  const n=H.q.length;
  if(local.ai<0){
    return `${header(H)}${waitScreen(H,'a',"You're locked in. Guessing starts when everyone's done.",'Skip waiting and start guessing')}
    <section class="panel"><div class="label">Your answers · tap to change</div>${H.q.map((qi,i)=>{const Q=qOf(H,i),a=local.a[i];return `<button class="sumrow" data-act="editA" data-v="${i}"><span class="lt">${LET[a]}</span><span class="q">${esc(Q.q)}<small>${esc(Q.o[a])}</small></span></button>`}).join('')}</section>`
  }
  const i=local.ai,Q=qOf(H,i);
  return `${header(H)}
  <section class="qbox" data-qkey="a-${H.id}-${i}">${qhead(H,me.pid,'','Your answers',`${i+1} / ${n}`)}${qdots(n,k=>local.a[k]>=0,i)}
   <div class="qbody"><div class="qtext">${esc(Q.q)}</div><p class="qhint">${HINT_A[i%HINT_A.length]}</p>${optList(Q,local.a[i],'ans')}
   <div class="qfoot">${i>0?`<button class="btn-link" data-act="backA">← Back</button>`:'<span></span>'}</div></div></section>`
}
function friendsStrip(H,ts,t){return `<div class="friends">${ts.map(x=>{const arr=local.g[x]||[];const done=arr.length===H.q.length&&arr.every(v=>v>=0);return `<span title="${esc(nameOf(H,x))}" style="display:contents">${dot(H,x,(x===t?'now':done?'done':''))}</span>`}).join('')}<span class="lbl">Friend ${ts.indexOf(t)+1} of ${ts.length}</span></div>`}
function vGuess(H){
  const st=gSteps(H);
  if(!st.length)return `${header(H)}<section class="panel"><h2>Sit this one out</h2><p class="muted">There's nobody else to guess about this round.</p>${hostSkip('Go to the reveal')}</section>`;
  if(local.gi<0||local.gi>=st.length){
    return `${header(H)}${waitScreen(H,'g',"Your guesses are in. The reveal starts when everyone's done.",'Skip waiting and start the reveal')}<button class="btn-link" data-act="editG">Review my guesses</button>`
  }
  const [t,i]=st[local.gi],Q=qOf(H,i);const ts=targetsFor(H,me.pid);const cur=(local.g[t]||[])[i];const nm=nameOf(H,t);
  if(!local.seen[t]){
    return `${header(H)}${friendsStrip(H,ts,t)}
    <section class="intro" data-qkey="i-${H.id}-${t}">${dot(H,t)}<div class="eyebrow">${ts.indexOf(t)===0?'First up':'Next up'}</div><div class="big">${esc(nm)}</div><p>How well do you know ${esc(nm)}? ${H.q.length} questions. Pick what you think they answered.</p><button data-act="introgo" data-v="${esc(t)}">Let's go</button></section>`
  }
  const arr=local.g[t]||[];
  return `${header(H)}${friendsStrip(H,ts,t)}
  <section class="qbox" data-qkey="g-${H.id}-${local.gi}">${qhead(H,t,'What did they pick?',nm,`${i+1} / ${H.q.length}`)}${qdots(H.q.length,k=>arr[k]>=0,i)}
   <div class="qbody"><div class="qtext">${esc(Q.q)}</div><p class="qhint">${HINT_G[(i+ts.indexOf(t))%HINT_G.length]}</p>${optList(Q,cur,'guess')}
   <div class="qfoot">${local.gi>0?`<button class="btn-link" data-act="backG">← Back</button>`:'<span></span>'}</div></div></section>`
}
function runningPts(H){const pl=players();const pts={};for(const [pid] of H.p)pts[pid]=0;H.tg.forEach((tg,ti)=>{for(let i=0;i<H.q.length;i++){if(ti>H.ri||(ti===H.ri&&(i>H.rq||(i===H.rq&&!H.rv))))return;for(const [pid] of H.p){if(pid===tg)continue;const x=pl[pid];const g=x&&x.pr.g&&x.pr.g.r===H.id&&x.pr.g.t&&x.pr.g.t[tg];if(typeof g==='string'&&g[i]===H.ans[tg][i])pts[pid]++}}});return pts}
function vReview(H){
  const tg=H.tg[H.ri];if(!tg)return vRound(H);
  const i=H.rq,Q=qOf(H,i),real=+H.ans[tg][i];const pl=players();
  const by=[[],[],[],[]];for(const [pid] of H.p){if(pid===tg)continue;const x=pl[pid];const g=x&&x.pr.g&&x.pr.g.r===H.id&&x.pr.g.t&&x.pr.g.t[tg];if(typeof g==='string'&&/[0-3]/.test(g[i]))by[+g[i]].push(pid)}
  const pts=runningPts(H);const order=[...H.p].sort((a,b)=>(pts[b[0]]||0)-(pts[a[0]]||0));
  const host=amHost();const last=H.ri===H.tg.length-1&&i===H.q.length-1;
  return `${header(H)}
  <section class="qbox" data-qkey="r-${H.id}-${H.ri}-${i}">${qhead(H,tg,tg===me.pid?"The truth about you":`Reveal · player ${H.ri+1} of ${H.tg.length}`,nameOf(H,tg),`${i+1} / ${H.q.length}`)}${qdots(H.q.length,k=>k<i,i)}
   <div class="qbody"><div class="qtext">${esc(Q.q)}</div>
   <div class="stack">${Q.o.map((o,k)=>{const right=H.rv&&k===real;const dim=H.rv&&k!==real;return `<div class="rv-opt ${right?'right':''} ${dim?'dim':''}"><div class="top"><span class="lt">${LET[k]}</span><span>${esc(o)}</span>${right?`<span class="badge">${esc(nameOf(H,tg))}'s answer</span>`:''}</div>${by[k].length?`<div class="chips">${by[k].map(pid=>`<span class="pchip ${right?'hit':''}">${dot(H,pid)}${esc(nameOf(H,pid))}${right?' +1':''}</span>`).join('')}</div>`:''}</div>`}).join('')}</div>
   ${host?`<button class="btn-main" data-act="next">${!H.rv?'Reveal answer':last?'Finish round':'Next question'}</button>`:`<p class="muted small" style="text-align:center">The host controls the reveal.</p>`}</div></section>
  <section class="panel"><div class="label">This round so far</div><div class="board">${order.map(([pid,n],k)=>`<div class="brow ${pid===me.pid?'me':''}"><span class="rk">${k+1}</span>${dot(H,pid)}<span class="nm">${esc(n)}</span><span class="pts">${pts[pid]||0}</span></div>`).join('')}</div></section>`
}
function board(H,showGain){const tot=H.tot||{},rp=H.rp||{};const ids=new Set([...H.p.map(x=>x[0]),...Object.keys(tot)]);const rows=[...ids].map(pid=>[pid,tot[pid]||0,rp[pid]||0]).sort((a,b)=>b[1]-a[1]);return {rows,html:`<div class="board">${rows.map(([pid,t,g],k)=>`<div class="brow ${pid===me.pid?'me':''}"><span class="rk">${k+1}</span>${dot(H,pid)}<span class="nm">${esc(nameOf(H,pid))}</span>${showGain?`<span class="gain">+${g}</span>`:''}<span class="pts">${t}</span></div>`).join('')}</div>`}}
function vRound(H){
  const b=board(H,true);const host=amHost();const fin=H.r>=H.R;
  return `${header(H)}<section class="panel"><h2>Round ${H.r} scores</h2><p class="muted small">One point for every answer you guessed right.</p>${b.html}</section>
  ${host?`<button class="btn-main" data-act="${fin?'final':'nextround'}">${fin?'See final results':'Start round '+(H.r+1)}</button>`:`<p class="muted" style="text-align:center">Waiting for the host…</p>`}`
}
function vFinal(H){
  const b=board(H,false);const top=b.rows.slice(0,3);const host=amHost();
  const pod=(r,cls,h)=>r?`<div class="pod ${cls}">${dot(H,r[0])}<span class="nm">${esc(nameOf(H,r[0]))}</span><div class="blk" style="height:${h}px">${r[1]}</div></div>`:'<div></div>';
  return `${header(H)}<div class="stack" style="text-align:center"><div class="label">Final results</div><h1>${esc(top[0]?nameOf(H,top[0][0]):'')} knows the crew best</h1></div>
  <div class="podium">${pod(top[1],'p2',70)}${pod(top[0],'p1',100)}${pod(top[2],'p3',50)}</div>
  <section class="panel"><div class="label">Leaderboard</div>${b.html}</section>
  ${host?`<button class="btn-main" data-act="again">Play again</button>`:`<p class="muted" style="text-align:center">The host can start a new game.</p>`}
  <button class="btn-link" data-act="leave">Leave lobby</button>`
}
function vSpectate(H){return `${header(H)}<section class="panel"><h2>Game in progress</h2><p class="muted">You'll be dealt in at the start of the next round if there's a seat. Want in now? Ask the host to tap <b>Menu → Restart to lobby</b>.</p>${H.p&&H.p.length?waitList(H,()=>false):''}</section><button class="btn-link" data-act="leave">Leave lobby</button>`}
function vNoHost(){return `<div class="bar"><span class="brand">Friendship Test</span><span class="chip code">${esc(code)}</span></div><section class="panel"><h2>${lastH?'Lost the host':'Connecting to the lobby…'}</h2><p class="muted">${lastH?'The host closed the game or lost connection. Trying to reconnect. The game continues when the host is back.':'Hang tight.'}</p>${lastH?`<button class="btn-main" data-act="rejoin" data-v="${esc(code)}">Try again now</button>`:''}</section><button class="btn-link" data-act="leave">Leave lobby</button>`}
function view(){
  if(!game)return vHome();
  const H=curH();if(!H)return vNoHost();
  if(H.ph==='lobby')return vLobby(H);
  const inGame=(H.p||[]).some(x=>x[0]===me.pid);
  if(!inGame&&H.ph!=='round'&&H.ph!=='final'&&H.ph!=='review')return vSpectate(H);
  if(H.ph==='answer')return vAnswer(H);
  if(H.ph==='guess')return vGuess(H);
  if(H.ph==='review')return vReview(H);
  if(H.ph==='round')return vRound(H);
  if(H.ph==='final')return vFinal(H);
  return vSpectate(H);
}
const app=document.getElementById('app');let lastView='';
function themeColor(){
  if(!game)return null;const H=curH();if(!H)return null;
  if(H.ph==='answer'&&local.ai>=0)return colorOf(H,me.pid);
  if(H.ph==='guess'){const st=gSteps(H);if(local.gi>=0&&local.gi<st.length)return colorOf(H,st[local.gi][0])}
  if(H.ph==='review'){const tg=H.tg&&H.tg[H.ri];if(tg)return colorOf(H,tg)}
  return null}
function applyTheme(){const c=themeColor();const de=document.documentElement;if(c){de.style.setProperty('--pc',c);de.classList.add('themed')}else{de.style.removeProperty('--pc');de.classList.remove('themed')}}
function render(){
  const act=document.activeElement;const fid=act&&act.id;let sel=null;try{sel=act&&act.selectionStart}catch(e){}
  const vals={};app.querySelectorAll('input').forEach(i=>vals[i.id]=i.value);
  applyTheme();
  const sh=menuSheet();if(sh!==lastSheet){const opening=!lastSheet&&sh;lastSheet=sh;const so=document.getElementById('sheet');so.innerHTML=sh;if(opening){const el=so.querySelector('.sheet');if(el)el.classList.add('enter')}}
  const html=view();if(html===lastView)return;lastView=html;app.innerHTML=html;
  const qk=app.querySelector('[data-qkey]');if(qk&&qk.dataset.qkey!==lastQKey){lastQKey=qk.dataset.qkey;qk.classList.add('enter')}else if(!qk)lastQKey='';
  for(const id in vals){const el=document.getElementById(id);if(el)el.value=vals[id]}
  if(fid){const el=document.getElementById(fid);if(el){el.focus();try{if(sel!=null)el.setSelectionRange(sel,sel)}catch(e){}}}
}

/* ---------- events ---------- */
function needName(){const el=document.getElementById('nm');const v=clean(el?el.value:me.name);if(!v){toast('Enter your name first.');el&&el.focus();return false}me.name=v;ls.set('wkw.name',v);return true}
app.addEventListener('input',e=>{if(e.target.id==='jc')e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menuOpen){menuOpen=false;menuArm=null;render();return}if(e.key==='Enter'&&e.target.id==='jc'){e.preventDefault();app.querySelector('[data-act=join]')?.click()}});
document.addEventListener('click',async e=>{
  let b=e.target.closest('[data-act]');
  if(b&&b.dataset.act==='menuclose'&&b.classList.contains('sheet-bg')&&e.target.closest('[data-stop]'))b=null;
  if(menuArm&&(!b||!['restart','menuleave'].includes(b.dataset.act))){menuArm=null;render()}
  if(fxOpen&&!e.target.closest('.fxwrap')){fxOpen=null;render()}
  if(!b||b.disabled)return;const a=b.dataset.act,v=b.dataset.v;const H=curH();
  switch(a){
    case 'fxopen':fxOpen=fxOpen===v?null:v;render();break;
    case 'fxself':fxOpen=null;render();playFx(b.dataset.k,me.name,me.pid);break;
    case 'fxsend':fxOpen=null;fxSend(b.dataset.k,v);render();break;
    case 'pickmode':pickMode=v;render();break;
    case 'create':if(needName())await createLobby();break;
    case 'join':{if(!needName())break;const c=(document.getElementById('jc')||{}).value||'';await joinGame(c);break}
    case 'rejoin':if(needName())await joinGame(v);break;
    case 'leave':leaveGame();break;
    case 'menu':menuOpen=!menuOpen;menuArm=null;fxOpen=null;render();break;
    case 'menuclose':menuOpen=false;menuArm=null;render();break;
    case 'menuleave':if(menuArm!=='leave'){menuArm='leave';render();break}leaveGame();toast('You left the lobby');break;
    case 'restart':if(!amHost())break;if(menuArm!=='restart'){menuArm='restart';render();break}menuOpen=false;menuArm=null;resetToLobby();toast('Back in the lobby. Anyone can join now.');break;
    case 'introgo':local.seen[v]=1;render();break;
    case 'copy':try{await navigator.clipboard.writeText(code);toast('Code copied')}catch(err){toast('Code: '+code)}break;
    case 'setmode':if(amHost()&&MODES[v]){hs.m=v;hs.u=[];pushHost()}break;
    case 'setR':if(amHost()){hs.R=+v;pushHost()}break;
    case 'setN':if(amHost()){hs.n=+v;pushHost()}break;
    case 'addbot':if(amHost()&&rosterLive().length<MAXP){hs.bots=hs.bots||[];const used=hs.bots.map(b=>b[1]);const nm=BOTNAMES.find(x=>!used.includes('Bot '+x))||String(hs.bots.length+1);hs.bots.push(['bot'+rand(5),'Bot '+nm]);pushHost()}break;
    case 'clearbots':if(amHost()){hs.bots=[];pushHost()}break;
    case 'start':if(amHost()){hs.tot={};hs.u=[];hs.r=0;newRound()}break;
    case 'ans':local.a[local.ai]=+v;local.ai=nextA();saveLocal();publishAnswers();lastView='';render();break;
    case 'backA':local.ai=Math.max(0,local.ai-1);render();break;
    case 'editA':local.ai=+v;render();break;
    case 'guess':{const st=gSteps(H);const[t,i]=st[local.gi];if(!local.g[t])local.g[t]=Array(H.q.length).fill(-1);local.g[t][i]=+v;
      let nx=local.gi+1;if(nx>=st.length||((local.g[st[nx][0]]||[])[st[nx][1]]>=0))nx=nextG(H);local.gi=nx;saveLocal();publishGuesses();render();break}
    case 'backG':local.gi=Math.max(0,local.gi-1);render();break;
    case 'editG':local.gi=0;render();break;
    case 'skip':if(amHost()){if(hs.ph==='answer')startGuess();else if(hs.ph==='guess')startReview()}break;
    case 'next':if(amHost()){if(!hs.rv){hs.rv=true}else{hs.rq++;hs.rv=false;if(hs.rq>=hs.q.length){hs.rq=0;hs.ri++}if(hs.ri>=hs.tg.length){endRound();break}}pushHost()}break;
    case 'nextround':if(amHost())newRound();break;
    case 'final':if(amHost()){hs.ph='final';pushHost()}break;
    case 'again':if(amHost())resetToLobby();break;
    case 'takeover':if(lastH){hs=JSON.parse(JSON.stringify(lastH));hs.code=code;pushHost();toast("You're the host now")}break;
  }
});

/* ---------- boot ---------- */
const BUILD='2026-10-14b';
(function newestVersion(){
  if(window.claude||!/^https?:$/.test(location.protocol))return;
  fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{
    const m=t.match(/const BUILD='([^']+)'/);if(!m||m[1]===BUILD||game)return;
    const key='ft-reloaded-'+m[1];if(ss.get(key))return;ss.set(key,'1');
    location.replace(location.pathname+'?v='+encodeURIComponent(m[1]));
  }).catch(()=>{});
})();
render();
(async()=>{
  if(window.claude&&window.claude.use){try{room=await window.claude.use('room')}catch(e){room=null}}
  roomState=(room||typeof WebSocket==='function')?'ok':'none';lastView='';render();
})();
</script>
